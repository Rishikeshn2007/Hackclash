<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comment Emotion Analyzer</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;800&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f; --surface: #13131a; --border: rgba(255,255,255,0.07);
      --text: #f0eee8; --muted: #6b6a78; --accent: #7c6af7;
      --anger:#f05a5a; --disgust:#7ec87e; --fear:#b07ef5;
      --joy:#f5c842; --neutral:#8899aa; --sadness:#5ab4f0; --surprise:#f09f5a;
      --aggressive:#f05a5a; --safe:#5dcaa5;
    }
    body { background:var(--bg); color:var(--text); font-family:'Syne',sans-serif; min-height:100vh; padding:2.5rem 1.5rem; }
    .wrap { max-width:860px; margin:0 auto; }
    h1 { font-size:clamp(1.8rem,4vw,2.8rem); font-weight:800; letter-spacing:-0.03em; margin-bottom:0.3rem; }
    h1 span { color:var(--accent); }
    .sub { font-family:'DM Mono',monospace; font-size:0.85rem; color:var(--muted); margin-bottom:2rem; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:1.5rem; margin-bottom:1.25rem; }
    textarea { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:10px; color:var(--text); font-family:'DM Mono',monospace; font-size:0.85rem; line-height:1.7; padding:1rem; resize:vertical; min-height:220px; outline:none; transition:border-color 0.2s; }
    textarea:focus { border-color:var(--accent); }
    textarea::placeholder { color:var(--muted); }
    .row { display:flex; align-items:center; justify-content:space-between; margin-top:1rem; gap:1rem; flex-wrap:wrap; }
    .hint { font-family:'DM Mono',monospace; font-size:0.75rem; color:var(--muted); }
    button { background:var(--accent); color:#fff; border:none; border-radius:8px; font-family:'Syne',sans-serif; font-weight:600; font-size:0.88rem; padding:0.55rem 1.4rem; cursor:pointer; transition:opacity 0.2s, transform 0.1s; }
    button:hover { opacity:0.85; }
    button:active { transform:scale(0.97); }
    button:disabled { opacity:0.35; cursor:not-allowed; }
    .btn-outline { background:transparent; border:1px solid var(--border); color:var(--muted); }
    .btn-outline:hover { border-color:var(--accent); color:var(--accent); opacity:1; }
    .error { font-family:'DM Mono',monospace; font-size:0.8rem; color:var(--anger); margin-top:0.5rem; display:none; }

    .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:1.25rem; }
    .stat { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:1rem; }
    .stat-label { font-family:'DM Mono',monospace; font-size:0.7rem; color:var(--muted); letter-spacing:0.08em; text-transform:uppercase; margin-bottom:6px; }
    .stat-val { font-size:1.7rem; font-weight:800; letter-spacing:-0.02em; }

    .charts-row { display:grid; grid-template-columns:1fr 1fr; gap:1.25rem; margin-bottom:1.25rem; }
    @media(max-width:600px) { .charts-row { grid-template-columns:1fr; } }
    .chart-box { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:1.25rem; }
    .chart-title { font-family:'DM Mono',monospace; font-size:0.7rem; color:var(--muted); letter-spacing:0.1em; text-transform:uppercase; margin-bottom:1rem; }

    .results-section { display:none; }
    .results-section.visible { display:block; }

    table { width:100%; border-collapse:collapse; font-size:0.82rem; }
    th { font-family:'DM Mono',monospace; font-size:0.68rem; color:var(--muted); letter-spacing:0.08em; text-transform:uppercase; text-align:left; padding:6px 10px; border-bottom:1px solid var(--border); }
    td { padding:10px; border-bottom:1px solid rgba(255,255,255,0.04); vertical-align:top; }
    tr:last-child td { border-bottom:none; }
    .id-cell { font-family:'DM Mono',monospace; color:var(--muted); font-size:0.78rem; }
    .comment-cell { color:var(--text); max-width:260px; line-height:1.5; }
    .badge { display:inline-block; font-family:'DM Mono',monospace; font-size:0.72rem; padding:3px 9px; border-radius:99px; font-weight:500; }
    .badge-agg { background:rgba(240,90,90,0.15); color:var(--anger); }
    .badge-safe { background:rgba(93,202,165,0.15); color:var(--safe); }

    .spinner { display:none; width:16px; height:16px; border:2px solid rgba(255,255,255,0.15); border-top-color:#fff; border-radius:50%; animation:spin 0.7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }

    .section-head { font-family:'DM Mono',monospace; font-size:0.7rem; color:var(--muted); letter-spacing:0.1em; text-transform:uppercase; margin-bottom:0.75rem; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>comment<span>.</span>lens</h1>
  <p class="sub">bulk emotion + aggression analysis · j-hartmann/emotion-english-distilroberta-base</p>

  <div class="card">
    <div class="section-head">input — paste json array of posts</div>
    <textarea id="inputJson" placeholder='[
  {"id": "1", "comment": "I love this product!"},
  {"id": "2", "comment": "This is absolutely terrible"},
  {"id": "3", "comment": "Okay I guess, nothing special"}
]'></textarea>
    <div class="row">
      <span class="hint">ctrl+enter to run &nbsp;·&nbsp; array of {id, comment}</span>
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="btn-outline" onclick="loadExample()">Load example</button>
        <div class="spinner" id="spinner"></div>
        <button id="runBtn" onclick="runAnalysis()">Analyze</button>
      </div>
    </div>
    <div class="error" id="errorMsg"></div>
  </div>

  <div class="results-section" id="resultsSection">

    <div class="stats-grid" id="statsGrid"></div>

    <div class="charts-row">
      <div class="chart-box">
        <div class="chart-title">emotion distribution</div>
        <div style="position:relative;width:100%;height:220px;">
          <canvas id="emotionChart" role="img" aria-label="Donut chart of emotion distribution across analyzed comments"></canvas>
        </div>
        <div id="emotionLegend" style="display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;"></div>
      </div>
      <div class="chart-box">
        <div class="chart-title">aggression score per comment</div>
        <div id="aggrChartWrap" style="position:relative;width:100%;">
          <canvas id="aggrChart" role="img" aria-label="Horizontal bar chart showing aggression score for each comment"></canvas>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="section-head">per-comment results</div>
      <div style="overflow-x:auto;">
        <table id="resultsTable">
          <thead>
            <tr>
              <th>ID</th><th>Comment</th><th>Emotion</th><th>Confidence</th><th>Aggression score</th><th>Flag</th>
            </tr>
          </thead>
          <tbody id="resultsBody"></tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<script>
const COLORS = {
  anger:'#f05a5a', disgust:'#7ec87e', fear:'#b07ef5',
  joy:'#f5c842', neutral:'#8899aa', sadness:'#5ab4f0', surprise:'#f09f5a'
};
const EMOJI = { anger:'😡',disgust:'🤢',fear:'😨',joy:'😄',neutral:'😐',sadness:'😢',surprise:'😲' };
let emotionChartInst = null;
let aggrChartInst = null;

const EXAMPLE = [
  {"id":"1","comment":"I absolutely love this, it made my day!"},
  {"id":"2","comment":"This is disgusting, I want a refund immediately"},
  {"id":"3","comment":"I'm scared it might stop working suddenly"},
  {"id":"4","comment":"The package arrived. It is on the table."},
  {"id":"5","comment":"Wow, didn't expect that feature at all!"},
  {"id":"6","comment":"I hate how they handled this, it's infuriating"},
  {"id":"7","comment":"Feeling a bit sad about the discontinuation"},
  {"id":"8","comment":"Best purchase I made this year, truly joyful"}
];

function loadExample() {
  document.getElementById('inputJson').value = JSON.stringify(EXAMPLE, null, 2);
}

document.getElementById('inputJson').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.ctrlKey) runAnalysis();
});

async function runAnalysis() {
  const raw = document.getElementById('inputJson').value.trim();
  const errEl = document.getElementById('errorMsg');
  errEl.style.display = 'none';

  let posts;
  try {
    posts = JSON.parse(raw);
    if (!Array.isArray(posts)) throw new Error('Must be a JSON array');
  } catch(e) {
    errEl.textContent = 'Invalid JSON: ' + e.message;
    errEl.style.display = 'block';
    return;
  }

  const btn = document.getElementById('runBtn');
  const spinner = document.getElementById('spinner');
  btn.disabled = true;
  spinner.style.display = 'block';

  try {
    const res = await fetch('/analyze', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ posts })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Server error');
    renderResults(data);
  } catch(e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    spinner.style.display = 'none';
  }
}

function renderResults(data) {
  const { results, summary } = data;
  document.getElementById('resultsSection').classList.add('visible');

  // Stats
  const aggrPct = Math.round((summary.aggressive_count / summary.total) * 100);
  document.getElementById('statsGrid').innerHTML = `
    <div class="stat"><div class="stat-label">Total comments</div><div class="stat-val">${summary.total}</div></div>
    <div class="stat"><div class="stat-label">Aggressive</div><div class="stat-val" style="color:var(--anger)">${summary.aggressive_count}</div></div>
    <div class="stat"><div class="stat-label">Safe</div><div class="stat-val" style="color:var(--safe)">${summary.non_aggressive_count}</div></div>
    <div class="stat"><div class="stat-label">Aggression rate</div><div class="stat-val" style="color:${aggrPct>40?'var(--anger)':'var(--text)'}">${aggrPct}%</div></div>
  `;

  // Emotion donut chart
  const dist = summary.emotion_distribution;
  const emotionLabels = Object.keys(dist);
  const emotionVals = emotionLabels.map(k => dist[k]);
  const emotionColors = emotionLabels.map(k => COLORS[k] || '#888');

  if (emotionChartInst) emotionChartInst.destroy();
  emotionChartInst = new Chart(document.getElementById('emotionChart'), {
    type: 'doughnut',
    data: { labels: emotionLabels, datasets: [{ data: emotionVals, backgroundColor: emotionColors, borderWidth: 0, hoverOffset: 4 }] },
    options: { responsive:true, maintainAspectRatio:false, cutout:'68%', plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label: ctx => ` ${ctx.label}: ${ctx.raw}` } } } }
  });

  const legendEl = document.getElementById('emotionLegend');
  legendEl.innerHTML = emotionLabels.map((lbl,i) =>
    `<span style="display:flex;align-items:center;gap:4px;">
      <span style="width:9px;height:9px;border-radius:2px;background:${emotionColors[i]};flex-shrink:0;"></span>
      ${lbl} ${emotionVals[i]}
    </span>`
  ).join('');

  // Aggression bar chart
  const aggrLabels = results.map(r => `#${r.id}`);
  const aggrScores = results.map(r => r.aggression_score);
  const aggrColors = results.map(r => r.aggression === 'yes' ? '#f05a5a' : '#5dcaa5');
  const barHeight = Math.max(results.length * 40 + 60, 200);
  document.getElementById('aggrChartWrap').style.height = barHeight + 'px';

  if (aggrChartInst) aggrChartInst.destroy();
  aggrChartInst = new Chart(document.getElementById('aggrChart'), {
    type: 'bar',
    data: { labels: aggrLabels, datasets: [{ label: 'Aggression %', data: aggrScores, backgroundColor: aggrColors, borderRadius: 4, borderSkipped: false }] },
    options: {
      indexAxis: 'y', responsive:true, maintainAspectRatio:false,
      scales: {
        x: { min:0, max:100, grid:{ color:'rgba(255,255,255,0.05)' }, ticks:{ color:'#6b6a78', font:{size:11}, callback: v => v+'%' } },
        y: { grid:{ display:false }, ticks:{ color:'#8899aa', font:{family:'DM Mono, monospace', size:11} } }
      },
      plugins: { legend:{display:false}, tooltip:{ callbacks:{ label: ctx => ` ${ctx.raw.toFixed(1)}% aggression` } } }
    }
  });

  // Table
  const tbody = document.getElementById('resultsBody');
  tbody.innerHTML = results.map(r => `
    <tr>
      <td class="id-cell">#${r.id}</td>
      <td class="comment-cell">${escHtml(r.comment)}</td>
      <td style="white-space:nowrap;">${EMOJI[r.emotion] || ''} <span style="color:${COLORS[r.emotion]}">${r.emotion}</span></td>
      <td style="font-family:'DM Mono',monospace;font-size:0.78rem;color:var(--muted);">${r.emotion_score}%</td>
      <td style="font-family:'DM Mono',monospace;font-size:0.78rem;color:${r.aggression==='yes'?'var(--anger)':'var(--muted)'};">${r.aggression_score}%</td>
      <td><span class="badge ${r.aggression==='yes'?'badge-agg':'badge-safe'}">${r.aggression==='yes'?'aggressive':'safe'}</span></td>
    </tr>
  `).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
