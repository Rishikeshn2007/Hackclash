<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emotion Detector</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --border: rgba(255,255,255,0.07);
      --text: #f0eee8;
      --muted: #6b6a78;
      --accent: #7c6af7;
      --accent-dim: rgba(124,106,247,0.12);
      --anger:   #f05a5a;
      --disgust: #7ec87e;
      --fear:    #b07ef5;
      --joy:     #f5c842;
      --neutral: #8899aa;
      --sadness: #5ab4f0;
      --surprise:#f09f5a;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.5rem;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      text-align: center;
      margin-bottom: 0.4rem;
    }
    h1 span { color: var(--accent); }

    .subtitle {
      font-size: 0.95rem;
      color: var(--muted);
      text-align: center;
      margin-bottom: 2.5rem;
      font-family: 'DM Mono', monospace;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.75rem;
      width: 100%;
      max-width: 640px;
    }

    textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 0.92rem;
      line-height: 1.6;
      padding: 1rem;
      resize: vertical;
      min-height: 120px;
      outline: none;
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: var(--accent); }
    textarea::placeholder { color: var(--muted); }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 1rem;
      gap: 1rem;
    }

    .char-count {
      font-family: 'DM Mono', monospace;
      font-size: 0.78rem;
      color: var(--muted);
    }

    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 0.6rem 1.5rem;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    button:hover { opacity: 0.88; }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .result-card {
      width: 100%;
      max-width: 640px;
      margin-top: 1.5rem;
      display: none;
    }
    .result-card.visible { display: block; }

    .top-emotion {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem 1.75rem;
      display: flex;
      align-items: center;
      gap: 1.25rem;
      margin-bottom: 1rem;
    }

    .emotion-emoji {
      font-size: 3rem;
      line-height: 1;
    }

    .emotion-label {
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-transform: capitalize;
    }

    .emotion-score {
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .bars-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.25rem 1.75rem;
    }

    .bars-title {
      font-size: 0.72rem;
      font-family: 'DM Mono', monospace;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 1.1rem;
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 0.7rem;
    }

    .bar-label {
      font-size: 0.82rem;
      font-family: 'DM Mono', monospace;
      width: 70px;
      text-transform: capitalize;
      color: var(--text);
      flex-shrink: 0;
    }

    .bar-track {
      flex: 1;
      height: 6px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .bar-pct {
      font-family: 'DM Mono', monospace;
      font-size: 0.78rem;
      color: var(--muted);
      width: 48px;
      text-align: right;
      flex-shrink: 0;
    }

    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-left: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      font-family: 'DM Mono', monospace;
      font-size: 0.82rem;
      color: var(--anger);
      margin-top: 0.5rem;
      display: none;
    }

    .examples {
      margin-top: 0.9rem;
    }
    .examples-label {
      font-size: 0.72rem;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.08em;
      margin-bottom: 0.5rem;
    }
    .example-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .pill {
      background: var(--accent-dim);
      border: 1px solid rgba(124,106,247,0.2);
      border-radius: 99px;
      color: #b4adff;
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      padding: 0.3rem 0.9rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .pill:hover { background: rgba(124,106,247,0.22); }
  </style>
</head>
<body>

<h1>emotion<span>.</span>detect</h1>
<p class="subtitle">j-hartmann/emotion-english-distilroberta-base · 7 classes</p>

<div class="card">
  <textarea id="inputText" placeholder="Type or paste any English text here…" maxlength="512"></textarea>
  <div class="row">
    <span class="char-count"><span id="charCount">0</span> / 512</span>
    <div style="display:flex;align-items:center;gap:8px;">
      <span class="error-msg" id="errorMsg">Error</span>
      <div class="spinner" id="spinner"></div>
      <button id="analyzeBtn" onclick="analyze()">Analyze</button>
    </div>
  </div>

  <div class="examples">
    <div class="examples-label">try an example →</div>
    <div class="example-pills">
      <span class="pill" onclick="setExample(this)">I can't believe they did this to me!</span>
      <span class="pill" onclick="setExample(this)">Today was the best day of my life 🎉</span>
      <span class="pill" onclick="setExample(this)">I don't know what to feel anymore…</span>
      <span class="pill" onclick="setExample(this)">That horror film actually scared me</span>
      <span class="pill" onclick="setExample(this)">The report is on the desk.</span>
    </div>
  </div>
</div>

<div class="result-card" id="resultCard">
  <div class="top-emotion">
    <div class="emotion-emoji" id="topEmoji"></div>
    <div>
      <div class="emotion-label" id="topLabel"></div>
      <div class="emotion-score" id="topScore"></div>
    </div>
  </div>

  <div class="bars-card">
    <div class="bars-title">all emotion scores</div>
    <div id="barsContainer"></div>
  </div>
</div>

<script>
const COLORS = {
  anger: '#f05a5a', disgust: '#7ec87e', fear: '#b07ef5',
  joy: '#f5c842', neutral: '#8899aa', sadness: '#5ab4f0', surprise: '#f09f5a'
};

const EMOJI = {
  anger:'😡', disgust:'🤢', fear:'😨', joy:'😄',
  neutral:'😐', sadness:'😢', surprise:'😲'
};

const textarea = document.getElementById('inputText');
const charCount = document.getElementById('charCount');
const spinner = document.getElementById('spinner');
const errorMsg = document.getElementById('errorMsg');
const btn = document.getElementById('analyzeBtn');

textarea.addEventListener('input', () => {
  charCount.textContent = textarea.value.length;
});

function setExample(el) {
  textarea.value = el.textContent.trim();
  charCount.textContent = textarea.value.length;
}

async function analyze() {
  const text = textarea.value.trim();
  if (!text) return;

  btn.disabled = true;
  spinner.style.display = 'block';
  errorMsg.style.display = 'none';

  try {
    const res = await fetch('/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Server error');
    renderResult(data);
  } catch (err) {
    errorMsg.textContent = err.message;
    errorMsg.style.display = 'inline';
  } finally {
    btn.disabled = false;
    spinner.style.display = 'none';
  }
}

function renderResult(data) {
  document.getElementById('topEmoji').textContent = data.emoji;
  document.getElementById('topLabel').textContent = data.top_emotion;
  document.getElementById('topLabel').style.color = COLORS[data.top_emotion] || '#fff';
  document.getElementById('topScore').textContent = `confidence: ${data.top_score}%`;

  const container = document.getElementById('barsContainer');
  container.innerHTML = '';

  data.all_scores.forEach(item => {
    const row = document.createElement('div');
    row.className = 'bar-row';
    row.innerHTML = `
      <span class="bar-label">${item.emoji} ${item.label}</span>
      <div class="bar-track">
        <div class="bar-fill" style="width:0%;background:${COLORS[item.label]}"></div>
      </div>
      <span class="bar-pct">${item.score}%</span>
    `;
    container.appendChild(row);
    setTimeout(() => {
      row.querySelector('.bar-fill').style.width = item.score + '%';
    }, 50);
  });

  const card = document.getElementById('resultCard');
  card.classList.add('visible');
}

textarea.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.ctrlKey) analyze();
});
</script>

</body>
</html>
